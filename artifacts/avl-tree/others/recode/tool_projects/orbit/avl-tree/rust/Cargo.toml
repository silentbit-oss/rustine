[package]
name = "avl-tree"
version = "0.1.0"
edition = "2021"

[features]
default = ["min"]
min = []

[lib]
name = "avl_tree"
path = "src/lib.rs"

[[bin]]
name = "avl_example"
path = "src/bin/avl_example.rs"

[[bin]]
name = "avl_test"
