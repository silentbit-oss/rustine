[[bin]]
name = "avl_bf_test_generated"
path = "src/bin/avl_bf_test_generated.rs"

[[bin]]
name = "avl_data_test_generated"
path = "src/bin/avl_data_test_generated.rs"

[dependencies]
rand = "0.8"

[dev-dependencies]
